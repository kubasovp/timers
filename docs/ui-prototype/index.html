<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timers UI Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" data-screen="main-dashboard">
      <!-- Pomodoro -->
      <section class="panel" data-context="pomodoro" data-state="idle">
        <h2>Pomodoro</h2>
        <div class="pomodoro-timer">25:00</div>
        <div class="actions">
          <button>Start</button>
          <button disabled>Pause</button>
          <button disabled>Skip</button>
        </div>
      </section>

      <!-- Timers -->
      <section class="panel" data-context="timers" data-state="running">
        <h2>Timers</h2>
        <form class="form">
          <label>
            Duration
            <input type="text" placeholder="MM:SS" />
          </label>
          <button type="button">Start</button>
        </form>

        <div class="list" aria-label="active timers">
          <div class="item" data-state="running">
            <span>Timer 01:30</span>
            <button>Cancel</button>
          </div>
        </div>
      </section>

      <!-- Reminders -->
      <section class="panel" data-context="reminders" data-state="scheduled">
        <h2>Reminders</h2>
        <form class="form">
          <label>
            Date
            <input type="date" />
          </label>
          <label>
            Time
            <input type="time" />
          </label>
          <label>
            Note
            <textarea placeholder="Note..."></textarea>
          </label>
          <button type="button">Create</button>
        </form>

        <div class="list" aria-label="scheduled reminders">
          <div class="item" data-state="scheduled">
            <span>Reminder: Example note</span>
            <button>Cancel</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
